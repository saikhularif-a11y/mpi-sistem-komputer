function talk(txt){try{const S=speechSynthesis;lv();const v=iv()||vs[0],q=(txt.match(/[^.?!]+[.?!]*/g)||[]).map(s=>s.trim()).filter(Boolean);const go=()=>q.forEach((s,i)=>{const u=new SpeechSynthesisUtterance(s);u.lang='id-ID';u.rate=.95;if(v)u.voice=v;if(i==0)u.onstart=()=>{if(!iv())stt('Suara Indonesia tidak ada, memakai suara '+(v?v.lang:'bawaan')+'.')};u.onerror=e=>stt('Suara gagal: '+e.error);S.speak(u)});if(S.speaking||S.pending){S.cancel();setTimeout(go,80)}else go()}catch(e){stt('Suara tidak didukung di peramban ini. Buka tautan di Chrome atau Safari.')}}
function say(d){if(!snd)return;tone(TN[d[1]]||[392,523,659]);talk(narr(d))}
function info(d){cur=d;const f=NF[d[4]];$("tg").textContent=d[1];$("nm").textContent=d[0];$("fn").textContent=d[2];$("ex").textContent=d[3]+(f?"\nTahukah kamu? "+f:"");lv();stt(snd&&vs.length&&!iv()?"Suara bahasa Indonesia tidak ditemukan di perangkat ini. Pasang suara Indonesia di pengaturan Text-to-speech (Android: Google Text-to-speech) agar narator berbicara.":"");$("sh").classList.add("on");say(d)}
function choose(g){
 const u=g.userData,d=u.d;
 if(mode!="rk"){hold=hold===g?null:g;if(hold)info(d);else $("sh").classList.remove("on");return}
 if(next>=ST.length&&u.i==8){boot();return}
 info(d);
 if(u.placed)return;
 if(u.i==next){const s=SL[next];u.tp.set(s[0],s[1],s[2]);u.ts=s[3];u.ry=s[4];u.placed=true;u.l.visible=false;W.remove(ghost);ghost=null;
  if(u.i==9)g.children[1].material.color.set(0x0b1220);
  if(u.i==8){W.userData.pt.visible=false;objs.forEach(o=>{if(o.userData.i<8){o.userData.tp.set(-3.3,.8,-.5);o.userData.ts=.02}});setTimeout(()=>objs.forEach(o=>{if(o.userData.i<8)o.visible=false}),800);spawn(9,14)}
  next++;if(next<ST.length)ghost=gh(next);step()
 }else{u.sh=1;hint("Belum tepat. Sekarang: "+(next<ST.length?HW[ST[next]][0]:"tekan Power pada casing")+".");tone([200,160])}}
const rc=new T.Raycaster(),P=new Map();let md=0,pd=0;
function pick(e){const r=cv.getBoundingClientRect();rc.setFromCamera(new T.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1),cam);
 const h=rc.intersectObjects(objs,true);if(h.length){let o=h[0].object;while(o&&!objs.includes(o))o=o.parent;if(o)return choose(o)}
 hold=null;$("sh").classList.remove("on")}
const pdist=()=>{const a=[...P.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1};
const zc=v=>Math.min(34,Math.max(4,v));
cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);P.set(e.pointerId,{x:e.clientX,y:e.clientY});md=0;if(P.size==2)pd=pdist()});
cv.addEventListener("pointermove",e=>{const p=P.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;md+=Math.abs(dx)+Math.abs(dy);
 if(P.size==1){gth-=dx*.007;gph=Math.min(1.45,Math.max(.2,gph-dy*.005))}else if(P.size==2){const d=pdist();grd=zc(grd*pd/d);pd=d}});
cv.addEventListener("pointerup",e=>{if(P.size==1&&md<8)pick(e);P.delete(e.pointerId)});
cv.addEventListener("pointercancel",e=>P.delete(e.pointerId));
cv.addEventListener("wheel",e=>{e.preventDefault();grd=zc(grd*(1+e.deltaY*.001))},{passive:false});
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>setMode(b.dataset.m));
["Semua",...GO].forEach(n=>{const b=document.createElement("button");b.textContent=n;if(GC[n])b.style.borderBottom="3px solid #"+GC[n].toString(16).padStart(6,"0");b.onclick=()=>{grp=n;setMode("hw")};$("gr").appendChild(b)});
$("sn").onclick=()=>{snd=!snd;$("sn").textContent=snd?"🔊 Suara":"🔇 Senyap";if(!snd)try{speechSynthesis.cancel()}catch(e){}};
$("rp").onclick=()=>cur&&say(cur);
$('ts').onclick=()=>{lv();const ua=navigator.userAgent,wv=/; wv\)/.test(ua)||(/iPhone|iPad/.test(ua)&&!/Safari/.test(ua)),v=iv();$('tg').textContent='Diagnosis';$('nm').textContent='Tes suara narator';$('fn').textContent='Dukungan suara: '+('speechSynthesis' in window?'ada':'tidak ada')+'. Jumlah suara: '+vs.length+'. Suara Indonesia: '+(v?v.name:'tidak ditemukan')+'.';$('ex').textContent=wv?'Halaman ini terbuka di dalam aplikasi (WebView), yang sering tidak punya suara. Buka tautan di Chrome atau Safari.':'';cur=['Tes','','Halo. Ini tes suara narator. Jika Anda mendengar suara ini, narator berfungsi.','','tes'];stt('');$('sh').classList.add('on');tone([523,659]);talk(cur[2])};
$("cl").onclick=()=>{hold=null;$("sh").classList.remove("on")};
function rs(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener("resize",rs);rs();

const hp=new T.Vector3(),dv=new T.Vector3(),RR=Math.PI*2;
function loop(t){
 t*=.001;th+=(gth-th)*.12;ph+=(gph-ph)*.12;rd+=(grd-rd)*.12;
 cam.position.set(tg.x+rd*Math.sin(ph)*Math.sin(th),tg.y+rd*Math.cos(ph),tg.z+rd*Math.sin(ph)*Math.cos(th));cam.lookAt(tg);
 cam.getWorldDirection(dv);hp.copy(cam.position).addScaledVector(dv,6.5);hp.y+=.7;
 objs.forEach(g=>{const u=g.userData;let tp=u.tp,ts=u.ts;
  if(g===hold){tp=hp;ts=u.hs*1.3;if(!BR.includes(u.d))g.rotation.y+=.015}
  else{const tr=u.ry+Math.round((g.rotation.y-u.ry)/RR)*RR;g.rotation.y+=(tr-g.rotation.y)*.15}
  if(BR.includes(u.d))g.rotation.y=th;
  if(mode=="rk"&&(u.i===next||(next==ST.length&&u.i==8)))ts*=1+.07*Math.sin(t*5);
  g.position.lerp(tp,.14);g.scale.setScalar(g.scale.x+(ts-g.scale.x)*.14);
  if(u.sh>.01){g.position.x+=Math.sin(t*50)*u.sh*.06;u.sh*=.9}});
 if(ghost)ghost.children.forEach(c=>{if(c.material)c.material.opacity=.45+.35*Math.sin(t*5)});
 R.render(sc,cam);requestAnimationFrame(loop)}
setMode("hw");requestAnimationFrame(loop);
</script></body></html>
